<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="t d">
<title id="t">Shabuktagin Photon Khan</title>
<desc id="d">Solutions engineer, ex senior full stack. Docker, Podman, Red Hat Linux, AWS, shell.</desc>
<defs>
<style>
@font-face{font-family:"CP";font-weight:700;src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:"STM";src:url(data:font/woff2;base64,) format("woff2")}
.disp{font-family:"CP","Chakra Petch",sans-serif;font-weight:700}
.mono{font-family:"STM","Share Tech Mono",monospace}
.gt,.gm,.gc{transform-box:fill-box;transform-origin:center}
.gm,.gc{opacity:0}
.gt{animation:gt 7s steps(1) infinite}
.gm{animation:gm 7s steps(1) infinite}
.gc{animation:gc 7s steps(1) infinite}
@keyframes gt{0%,100%{transform:none}2%{transform:translate(2px,0)}3.5%{transform:translate(-1px,0)}4.5%{transform:none}51%{transform:translate(-2px,0)}52%{transform:none}}
@keyframes gm{0%,100%{opacity:0;transform:none}1.5%{opacity:1;transform:translate(-7px,0)}3%{transform:translate(5px,1px)}4.5%{opacity:0}50.5%{opacity:1;transform:translate(-4px,2px)}52%{opacity:0}}
@keyframes gc{0%,100%{opacity:0;transform:none}2%{opacity:1;transform:translate(7px,0)}3.5%{transform:translate(-5px,-1px)}5%{opacity:0}51%{opacity:1;transform:translate(4px,-2px)}52.5%{opacity:0}}
.blink{animation:blink 1.6s steps(1) infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.gm,.gc{opacity:0}}
</style>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#2A2050"/></pattern>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2" fill="#000" opacity=".16"/></pattern>
<pattern id="hazard" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="14" fill="#F5FF3D"/></pattern>
<linearGradient id="sweep" x1="1" y1="0" x2=".5" y2="-.87"><stop offset="0" stop-color="#00F0FF" stop-opacity=".5"/><stop offset="1" stop-color="#00F0FF" stop-opacity="0"/></linearGradient>
<linearGradient id="scanbar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00F0FF" stop-opacity="0"/><stop offset="1" stop-color="#00F0FF" stop-opacity=".09"/></linearGradient>
<clipPath id="frame"><path d="M0,0 H1182 L1200,18 V340 H18 L0,322 Z"/></clipPath>
<clipPath id="bandm"><rect x="60" y="170" width="520" height="22"><animate attributeName="y" values="176;214;188;236;200" dur="7s" calcMode="discrete" repeatCount="indefinite"/></rect></clipPath>
<clipPath id="bandc"><rect x="60" y="200" width="520" height="14"><animate attributeName="y" values="222;184;240;196;230" dur="7s" calcMode="discrete" repeatCount="indefinite"/></rect></clipPath>
</defs>

<g clip-path="url(#frame)">
<rect width="1200" height="340" fill="#07040F"/>
<rect width="1200" height="340" fill="url(#dots)"/>
<rect width="1200" height="60" fill="url(#scanbar)"><animate attributeName="y" values="-60;340" dur="7s" repeatCount="indefinite"/></rect>

<!-- radar -->
<g transform="translate(1000 170)" fill="none" stroke="#241A45" stroke-width="1">
<circle r="118"/><circle r="80"/><circle r="42"/>
<path d="M-124,0 H124 M0,-124 V124" stroke-dasharray="6 6"/>
<circle r="118" stroke="#00F0FF" stroke-opacity=".35"/>
<path d="M0,0 L118,0 A118,118 0 0,0 59,-102.2 Z" fill="url(#sweep)" stroke="none"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/></path>
<line x1="0" y1="0" x2="118" y2="0" stroke="#00F0FF" stroke-opacity=".9"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/></line>
<g fill="#FF2BD6" stroke="none">
<circle cx="52" cy="-61" r="3"><animate attributeName="opacity" values="0;1;0.1;0" keyTimes="0;.05;.5;1" dur="4s" begin="3.4s" repeatCount="indefinite"/></circle>
<circle cx="-70" cy="-30" r="3"><animate attributeName="opacity" values="0;1;0.1;0" keyTimes="0;.05;.5;1" dur="4s" begin="2.2s" repeatCount="indefinite"/></circle>
<circle cx="-24" cy="88" r="3"><animate attributeName="opacity" values="0;1;0.1;0" keyTimes="0;.05;.5;1" dur="4s" begin="1.2s" repeatCount="indefinite"/></circle>
</g>
<circle r="2.5" fill="#00F0FF" stroke="none"/>
</g>

<!-- status -->
<rect x="72" y="66" width="9" height="9" fill="#00F0FF" class="blink"/>
<text x="92" y="75" class="mono" font-size="16" fill="#00F0FF" letter-spacing="2">SOLUTIONS ENGINEER</text>

<!-- name -->
<text x="70" y="150" class="disp" font-size="34" fill="#C8D3F5" letter-spacing="3">SHABUKTAGIN KHAN</text>
<g>
<text x="66" y="255" class="disp gm" font-size="112" fill="#FF2BD6" clip-path="url(#bandm)">PHOTON</text>
<text x="66" y="255" class="disp gc" font-size="112" fill="#00F0FF" clip-path="url(#bandc)">PHOTON</text>
<text x="66" y="255" class="disp gt" font-size="112" fill="#F2F5FF">PHOTON</text>
</g>

<!-- light line -->
<line x1="72" y1="272" x2="850" y2="272" stroke="#241A45" stroke-width="1"/>
<line x1="72" y1="272" x2="850" y2="272" stroke="#00F0FF" stroke-width="1.5" stroke-dasharray="90 778"><animate attributeName="stroke-dashoffset" from="868" to="0" dur="5s" repeatCount="indefinite"/></line>

<text x="72" y="304" class="mono" font-size="17" fill="#6B7399">ex senior full stack  //  docker  podman  rhel  aws  shell</text>

<!-- hazard -->
<rect x="18" y="331" width="240" height="5" fill="url(#hazard)"/>

<rect width="1200" height="340" fill="url(#scan)"/>
</g>

<!-- frame -->
<path d="M.5,.5 H1181.5 L1199.5,18.5 V339.5 H18.5 L.5,321.5 Z" fill="none" stroke="#241A45"/>
<path d="M.5,24 V.5 H24 M1176,339.5 H1199.5 V316" fill="none" stroke="#00F0FF" stroke-width="2"/>
</svg>
